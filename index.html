<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Calendar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calendar {
            width: 350px;
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h2 {
            font-size: 1.4rem;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .calendar-header button {
            background: #334155;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .calendar-header button:hover {
            background: #475569;
            color: #38bdf8;
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 100sfr);
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 10px;
            text-align: center;
        }

        .weekdays div {
            width: 40px;
        }

        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
            text-align: center;
        }

        .days div {
            padding: 10px 0;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            font-weight: 500;
        }

        .days div:hover:not(.empty) {
            background: #475569;
        }

        .days .today {
            background: #38bdf8 !important;
            color: #0f172a;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        .days .empty {
            cursor: default;
        }
    </style>
</head>
<body>

    <div class="calendar">
        <div class="calendar-header">
            <button id="prevBtn">&lt;</button>
            <h2 id="monthYear">June 2026</h2>
            <button id="nextBtn">&gt;</button>
        </div>
        
        <div class="weekdays">
            <div>Su</div>
            <div>Mo</div>
            <div>Tu</div>
            <div>We</div>
            <div>Th</div>
            <div>Fr</div>
            <div>Sa</div>
        </div>

        <div class="days" id="calendarDays"></div>
    </div>

    <script>
        const monthYearText = document.getElementById('monthYear');
        const calendarDays = document.getElementById('calendarDays');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        let currentDate = new Date();

        const months = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        function renderCalendar() {
            currentDate.setDate(1);
            const month = currentDate.getMonth();
            const year = currentDate.getFullYear();

            monthYearText.textContent = `${months[month]} ${year}`;

            const lastDay = new Date(year, month + 1, 0).getDate();
            const firstDayIndex = currentDate.getDay();

            let daysHtml = "";

            // Empty spaces for previous month shortcut
            for (let x = firstDayIndex; x > 0; x--) {
                daysHtml += `<div class="empty"></div>`;
            }

            // Current month days
            const today = new Date();
            for (let i = 1; i <= lastDay; i++) {
                if (i === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    daysHtml += `<div class="today">${i}</div>`;
                } else {
                    daysHtml += `<div>${i}</div>`;
                }
            }

            calendarDays.innerHTML = daysHtml;
        }

        prevBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        nextBtn.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        renderCalendar();
    </script>

</body>
</html>
